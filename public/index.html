<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №6</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
</head>
<body>
    <main class="container">
        <h1>Лабораторная работа №6</h1>
        
        <nav>
            <a href="/about.html">О себе →</a>
        </nav>

        <hr>

        <div class="form-group">
            <label for="nameInput">Введите ваше имя:</label>
            <input type="text" id="nameInput" placeholder="Например, Татьяна">
        </div>

        <div class="form-group">
            <label for="langSelect">Язык приветствия:</label>
            <select id="langSelect">
                <option value="en">English (default)</option>
                <option value="ru">Русский</option>
            </select>
        </div>

        <button id="greetBtn">Получить приветствие</button>

        <h3>Результат от API:</h3>
        <pre id="result">Здесь появится JSON-ответ...</pre>
    </main>

    <script>
        document.getElementById('greetBtn').addEventListener('click', async () => {
            const name = document.getElementById('nameInput').value.trim();
            const lang = document.getElementById('langSelect').value;

            if (!name) {
                alert('Пожалуйста, введите имя!');
                return;
            }

            try {
                const response = await fetch(`/api/greet/${encodeURIComponent(name)}?lang=${lang}`);
                const data = await response.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('result').textContent = 'Ошибка запроса: ' + error.message;
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker зарегистрирован:', reg.scope))
                    .catch(err => console.error('Ошибка регистрации SW:', err));
            });
        }
    </script>
</body>
</html>
